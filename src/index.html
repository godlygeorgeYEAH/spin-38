<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/images/animales/CABALLO.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
  <script>
    (function() {
      var el = document.createElement('div');
      el.id = 'vp-debug';
      el.style.cssText = 'position:fixed;top:30px;left:6px;z-index:999999;background:rgba(0,0,0,.75);color:#0f0;font:bold 11px/1.4 monospace;padding:3px 7px;border-radius:4px;pointer-events:none';
      function update() { el.textContent = window.innerWidth + ' × ' + window.innerHeight; }
      update();
      window.addEventListener('resize', update);
      document.body.appendChild(el);
    })();
  </script>
</body>

</html>
